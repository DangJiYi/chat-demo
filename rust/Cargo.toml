[package]
name = "dsh-chat-server"
version = "0.1.0"
edition = "2021"
description = "dsh-chat 本地服务（Rust 重写，逐步替代 server.py）"

[[bin]]
name = "dsh-chat"
path = "src/main.rs"

# 同一个 crate 既是命令行程序（Windows）又是动态库（安卓 .so）。
#
# 安卓没有“双击运行”这回事：Java 侧 System.loadLibrary 加载 .so，
# 再通过 JNI 调进去把服务器跑起来，WebView 加载 127.0.0.1。
# cdylib 是 JNI 的前提，所以这里必须生成 .so。
[lib]
name = "dsh_chat_server"
crate-type = ["rlib", "cdylib"]

[dependencies]
# 同步 HTTP，不引 tokio：并发上限就是「一个 WebView + 一个同步端口」
tiny_http = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 附件按内容寻址（media/<sha256>），与 Python 版的 hashlib.sha256 一致
sha2 = "0.10"
# 归档是 .jsonl.gz，搜索和归档去重都要解压
flate2 = "1"

# TLS 后端分平台，原因很具体：
#
#  - Windows / Linux / macOS 用 **native-tls**：走系统实现（Schannel /
#    OpenSSL），体积小、跟系统证书库一致。
#  - 安卓用 **rustls**：native-tls 在安卓上要交叉编译 OpenSSL（要 perl、make、
#    还有一堆 NDK 变数），几乎不可能在 CI 里稳定编出来；
#    rustls 是纯 Rust，交叉编译就是换个 target 而已。
#    代价是证书根用 webpki-roots（随二进制内置），约 +1.5 MB。
#
# proxy-from-env：读 HTTP_PROXY/HTTPS_PROXY/ALL_PROXY，与 Python 版一致。
[target.'cfg(not(target_os = "android"))'.dependencies]
ureq = { version = "2", default-features = false, features = [
    "native-tls",
    "json",
    "proxy-from-env",
] }

[target.'cfg(target_os = "android")'.dependencies]
ureq = { version = "2", default-features = false, features = [
    "tls",
    "json",
    "proxy-from-env",
] }
# JNI 绑定。只在安卓编译，其他平台完全不会引入。
jni = "0.21"

# 托盘图标：只用系统 API，不引 GUI 框架。
#
# windows-sys 是纯绑定（几乎不增体积），比手写 extern 声明安全——
# 像 NOTIFYICONDATAW 这种结构体，字段少了会在 Shell_NotifyIconW 里踩内存。
#
# **Win32_Graphics_Gdi 必须开着**：`WNDCLASSW` 和 `RegisterClassW` 都挂在它下面
# （结构体里有 HBRUSH/HICON/HCURSOR 字段，所以被归到 GDI 那一组）。
# 不加的报错是 “no `RegisterClassW` in Win32::UI::WindowsAndMessaging”，
# 看上去像是符号不存在，实际只是 feature 没开。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# 把 .ico 嵌进 exe 本体（资源管理器/任务栏的图标就靠它）。
# 只在 Windows 主机上需要：build.rs 为宿主编译，android 交叉编译时不会引入。
[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

# 体积优先：opt-level=z + LTO + strip，panic=abort 去掉展开表
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
