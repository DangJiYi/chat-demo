[package]
name = "dsh-chat-server"
version = "0.1.0"
edition = "2021"
description = "dsh-chat 本地服务（Rust 重写，逐步替代 server.py）"

[[bin]]
name = "dsh-chat"
path = "src/main.rs"

[dependencies]
# 同步 HTTP，不引 tokio：并发上限就是「一个 WebView + 一个同步端口」
tiny_http = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 附件按内容寻址（media/<sha256>），与 Python 版的 hashlib.sha256 一致
sha2 = "0.10"
# 归档是 .jsonl.gz，搜索和归档去重都要解压
flate2 = "1"
# 只有 /local/balance 需要出站 HTTPS（查余额）。
# default-features=false 是为了排除默认的 rustls（约 +1.5 MB）；
# native-tls 在 Windows 上用 Schannel、Linux/macOS 用系统 OpenSSL，体积小得多。
# json 特性提供 into_json()，测试和余额解析都要用。
# proxy-from-env：默认读 HTTP_PROXY/HTTPS_PROXY/ALL_PROXY。
# Python 版的 urllib 本来就会读这些变量，不开的话同一台机器上
# “Python 版能查余额、Rust 版报网络错”这种差异会让人找不出原因。
ureq = { version = "2", default-features = false, features = [
    "native-tls",
    "json",
    "proxy-from-env",
] }

# 托盘图标：只用系统 API，不引 GUI 框架。
#
# windows-sys 是纯绑定（几乎不增体积），比手写 extern 声明安全——
# 像 NOTIFYICONDATAW 这种结构体，字段少了会在 Shell_NotifyIconW 里踩内存。
#
# **Win32_Graphics_Gdi 必须开着**：`WNDCLASSW` 和 `RegisterClassW` 都挂在它下面
# （结构体里有 HBRUSH/HICON/HCURSOR 字段，所以被归到 GDI 那一组）。
# 不加的报错是 “no `RegisterClassW` in Win32::UI::WindowsAndMessaging”，
# 看上去像是符号不存在，实际只是 feature 没开。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# 体积优先：opt-level=z + LTO + strip，panic=abort 去掉展开表
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
