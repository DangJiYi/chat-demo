name: rust-build

# Rust 后端的统一构建入口：**一次触发，同时出 Windows 和 Android**。
#
# 以前 Windows 和 Android 分属两个工作流（一个只管 Rust 的 Windows，另一个的
# android job 挤在带旧 Python windows job 的 build 里），同一个 tag 要点两次，
# artifact 名字相近却分属两代产品。现在合并到这一个文件：
#   web     → 构建前端（两个平台都要用）
#   windows → cargo 测试 + 单 exe（前端已内嵌）
#   android → cargo ndk 出 .so + gradle 出 APK
#
# 仓库里那份 www/ 只当“参考产物”：两个 job 都会用 web 的产物覆盖它。

on:
  push:
    # **push 到 main 就构建。** 少这一行就只能手点 Run workflow——
    # 以前这里只监听 tag，所以推代码“没反应”，必须去网页手动触发。
    branches: [main]
    # tag 也构建：发版时想用 v* 当版本号就推 tag
    tags: ['v*']
  workflow_dispatch:

# 同一分支的新推送取消旧运行：省额度，也避免拿旧 commit 的产物。
# 注意 group 里带 github.ref，main 和 tag 各算一组，不会互相取消。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # read：正常构建只需读代码。
  # 失败日志要推回 ci-log 分支，那里单独提权（见 Publish build log）。
  contents: read

jobs:
  # ---------------------------------------------------------------- Web
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: '9'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # DSH_LOCAL=1 → apiOrigin 为空，请求走同源，由本地服务反向代理注入 Key。
      # 漏了这个就变成直连上游 + 哨兵值当 Key，聊天恒 401。
      - name: Build frontend
        run: pnpm build
        env:
          DSH_LOCAL: '1'

      - name: Trim font formats WebView never loads
        run: |
          find dist/static/media -name '*.ttf' -delete
          find dist/static/media -name '*.woff' -delete

      - name: Verify same-origin build
        run: |
          if grep -rq 'https://api.deepseek.com' dist/static/js/; then
            echo "::error::dist 里出现了绝对地址，DSH_LOCAL 没生效"
            exit 1
          fi

      - uses: actions/upload-artifact@v5
        with:
          name: www-dist
          path: dist
          if-no-files-found: error

  # ---------------------------------------------------------------- Windows
  windows:
    needs: [web]
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      # **必须最先做。** `rust/build.rs` 在编译期把 www/ 内嵌进二进制，
      # 所以 www 必须在 cargo 之前就位；否则打进去的是仓库里那份旧产物。
      # clippy/test 也会编译二进制（集成测试用 CARGO_BIN_EXE），同样吃这个顺序。
      - name: Replace www with CI build
        shell: bash
        run: |
          rm -rf www
          mkdir -p www

      - uses: actions/download-artifact@v5
        with:
          name: www-dist
          path: www

      - uses: dtolnay/rust-toolchain@stable

      # 图标源图在 assets/icon.png；exe 图标由 build.rs 嵌入。
      - name: Generate icons
        # 图标是装饰：生成失败不该阻断发布。仓库里已经提交了 app.ico 与 mipmap，
        # build.rs 用现成的那份；这里失败时会在日志里留下红叉和报错，
        # 但后面的编译/打包照常跑。
        continue-on-error: true
        run: python tools/make-icons.py

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          # 两个 job 的 target 不同（msvc / aarch64-linux-android），
          # 缓存 key 不分开会互相覆盖。
          key: windows

      - name: Clippy
        working-directory: rust
        # 只有 correctness / suspicious 这两个组阻断编译，其余风格问题（如
        # uninlined_format_args、needless_borrow）只显示不拦。
        #
        # 为什么不再用 -D warnings：那个是「所有警告当错误」的全局开关，
        # 每轮只报最先的几条，得反复推 CI 才能收敛（已经为此烧了几轮）。
        # 风格问题该修，但不该阻断 2000 行代码的迁移。
        run: cargo clippy --all-targets -- -W clippy::all -D clippy::correctness -D clippy::suspicious

      # 计费口径必须自证：峰谷判定、日期换算、费用系数。
      # 用 dev profile 跑：release 设了 panic=abort，和测试运行器冲突。
      - name: Unit tests
        working-directory: rust
        run: cargo test

      - name: Build
        working-directory: rust
        run: cargo build --release

      # 真实启动服务并用 HTTP 请求验证。
      # 只有「能跑起来且返回正确 JSON」才算骨架成立。
      - name: Smoke test
        shell: pwsh
        run: |
          $exe = (Resolve-Path "rust/target/release/dsh-chat.exe").Path
          Write-Host ("exe 大小: {0:N2} MB" -f ((Get-Item $exe).Length / 1MB))

          # 在临时目录里跑，用相对路径传 --data，避开含空格的绝对路径
          $work = Join-Path $env:RUNNER_TEMP "rustsmoke"
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          Set-Location $work
          New-Item -ItemType Directory -Force -Path "data\sessions" | Out-Null

          # 造两个会话，验证解析、UTF-8 标题、updatedAt 倒序
          '{"id":"s1","title":"会话一","createdAt":1000,"updatedAt":2000,"messages":[]}' |
            Set-Content -Encoding utf8 "data\sessions\s1.json"
          '{"id":"s2","title":"会话二","createdAt":1000,"updatedAt":3000,"messages":[]}' |
            Set-Content -Encoding utf8 "data\sessions\s2.json"

          # 造一个最小静态站，验证静态文件与 SPA fallback
          New-Item -ItemType Directory -Force -Path "www\static\js" | Out-Null
          Set-Content -Encoding utf8 "www\index.html" '<!doctype html><title>t</title><div id=root></div>'
          Set-Content -Encoding utf8 "www\static\js\app.js" 'console.log(1)'

          $p = Start-Process -FilePath $exe -ArgumentList '--port','8799','--data','data','--www','www','--no-open','--console' `
               -PassThru -NoNewWindow -RedirectStandardOutput "out.txt"
          try {
            $ok = $false
            for ($i = 0; $i -lt 40; $i++) {
              Start-Sleep -Milliseconds 250
              try {
                $r = Invoke-RestMethod -Uri "http://127.0.0.1:8799/local/status" -TimeoutSec 2
                if ($r.version) { $ok = $true; break }
              } catch { }
            }
            if (-not $ok) {
              Get-Content "out.txt" -ErrorAction SilentlyContinue
              throw "服务在 10 秒内未就绪"
            }
            Write-Host ("/local/status -> " + ($r | ConvertTo-Json -Compress))

            # 不要用 @(Invoke-RestMethod ...)：它把整个 JSON 数组当成一个对象输出，
            # @() 再包一层就成了「含数组的数组」，.Count 恒为 1（上一轮就是这么误报的）。
            # 先取原文再解析，并显式断言原文是数组，同时把出参打印出来便于排查。
            $raw = (Invoke-WebRequest -Uri "http://127.0.0.1:8799/db/summaries" -TimeoutSec 5).Content
            Write-Host ("/db/summaries raw -> " + $raw)
            if (-not $raw.TrimStart().StartsWith('[')) {
              throw "期望返回 JSON 数组，实际开头是: $($raw.Substring(0, [Math]::Min(60, $raw.Length)))"
            }
            $s = @($raw | ConvertFrom-Json)
            Write-Host ("条目数 -> " + $s.Count)

            if ($s.Count -ne 2) { throw "期望 2 条会话，实际 $($s.Count)" }
            if ($s[0].id -ne 's2') { throw "应按 updatedAt 倒序，首条应是 s2，实际 $($s[0].id)" }
            if ($s[1].id -ne 's1') { throw "次条应是 s1，实际 $($s[1].id)" }
            if ($s[0].title -ne '会话二') { throw "UTF-8 标题解析错误: $($s[0].title)" }
            if ($s[0].updatedAt -ne 3000) { throw "updatedAt 字段名/值不对（应为 camelCase 的 3000），实际 $($s[0].updatedAt)" }
            if ($s[0].createdAt -ne 1000) { throw "createdAt 字段名/值不对（应为 camelCase 的 1000），实际 $($s[0].createdAt)" }

            # 带扩展名却找不到 → 404（不能兜底成 index.html）
            $code = (Invoke-WebRequest -Uri "http://127.0.0.1:8799/nope.js" -SkipHttpErrorCheck).StatusCode
            if ($code -ne 404) { throw "带扩展名的未知路径应返回 404，实际 $code" }

            # ---------- 静态文件 ----------
            $idx = Invoke-WebRequest -Uri "http://127.0.0.1:8799/" -TimeoutSec 5
            if ($idx.StatusCode -ne 200) { throw "GET / 应返回 200，实际 $($idx.StatusCode)" }
            if ($idx.Content -notmatch '<div id=root>') { throw "GET / 未返回 index.html" }
            if ($idx.Headers['Content-Type'] -notmatch 'text/html') { throw "index.html 的 Content-Type 不对" }

            $js = Invoke-WebRequest -Uri "http://127.0.0.1:8799/static/js/app.js" -TimeoutSec 5
            if ($js.Headers['Content-Type'] -notmatch 'javascript') { throw "js 的 Content-Type 不对: $($js.Headers['Content-Type'])" }
            if ($js.Headers['Cache-Control'] -notmatch 'immutable') { throw "static/ 下的资源应为长缓存，实际 $($js.Headers['Cache-Control'])" }

            # SPA fallback：无扩展名的未知路径应返回 index.html
            $fb = Invoke-WebRequest -Uri "http://127.0.0.1:8799/some/route" -TimeoutSec 5
            if ($fb.Content -notmatch '<div id=root>') { throw "未知无扩展名路径应回退到 index.html" }

            # 目录穿越必须被拒绝。
            # 用 %2e%2e%2f 而不是字面的 ../，否则 .NET 的 Uri 会先规范化，
            # 请求根本到不了服务端，这条断言就形同虚设。
            $trav = Invoke-WebRequest -Uri "http://127.0.0.1:8799/%2e%2e%2fbuild.gradle" -SkipHttpErrorCheck -TimeoutSec 5
            if ($trav.StatusCode -eq 200) { throw "目录穿越未被拦下" }

            # ---------- 会话读写 ----------
            $one = Invoke-RestMethod -Uri "http://127.0.0.1:8799/db/session/s1" -TimeoutSec 5
            if ($one.id -ne 's1') { throw "GET /db/session/s1 返回错误: $($one.id)" }

            $newDoc = '{"id":"s3","title":"新建","createdAt":5000,"updatedAt":5000,"messages":[]}'
            $put = Invoke-WebRequest -Uri "http://127.0.0.1:8799/db/session/s3" -Method Put `
                   -Body $newDoc -ContentType 'application/json' -SkipHttpErrorCheck -TimeoutSec 5
            if ($put.StatusCode -ne 204) { throw "PUT 应返回 204，实际 $($put.StatusCode)" }
            if (-not (Test-Path "data\sessions\s3.json")) { throw "PUT 后文件未落盘" }

            # id 与路径不一致必须拒绝（与 Python 版一致的校验）
            $bad = Invoke-WebRequest -Uri "http://127.0.0.1:8799/db/session/wrong" -Method Put `
                   -Body $newDoc -ContentType 'application/json' -SkipHttpErrorCheck -TimeoutSec 5
            if ($bad.StatusCode -ne 500) { throw "id 不一致应返回 500，实际 $($bad.StatusCode)" }
            if ($bad.Content -notmatch 'id 不一致') { throw "错误文案未说明 id 不一致: $($bad.Content)" }

            $ren = Invoke-WebRequest -Uri "http://127.0.0.1:8799/db/session/s3/rename" -Method Post `
                   -Body '{"title":"改名了"}' -ContentType 'application/json' -SkipHttpErrorCheck -TimeoutSec 5
            if ($ren.StatusCode -ne 204) { throw "rename 应返回 204，实际 $($ren.StatusCode)" }
            $after = Invoke-RestMethod -Uri "http://127.0.0.1:8799/db/session/s3" -TimeoutSec 5
            if ($after.title -ne '改名了') { throw "改名未生效: $($after.title)" }

            $del = Invoke-WebRequest -Uri "http://127.0.0.1:8799/db/session/s3" -Method Delete -SkipHttpErrorCheck -TimeoutSec 5
            if ($del.StatusCode -ne 204) { throw "DELETE 应返回 204，实际 $($del.StatusCode)" }
            # 删除是写墓碑，不是删文件（同步靠它得知“这条被删了”）
            if (-not (Test-Path "data\sessions\s3.json")) { throw "删除不应移除文件，只写墓碑" }
            $delDoc = Get-Content "data\sessions\s3.json" -Raw | ConvertFrom-Json
            if (-not $delDoc.deleted) { throw "墓碑标记缺失" }

            # 墓碑不能出现在列表里
            $raw2 = (Invoke-WebRequest -Uri "http://127.0.0.1:8799/db/summaries" -TimeoutSec 5).Content
            if ($raw2 -match '"s3"') { throw "墓碑会话不应出现在 /db/summaries" }

            # ---------- 附件（内容寻址）----------
            $ab = [System.Text.Encoding]::UTF8.GetBytes('hello-attachment')
            $pf = Invoke-WebRequest -Uri 'http://127.0.0.1:8799/db/file/att1' -Method Put -Body $ab -ContentType 'text/plain' -Headers @{ 'X-File-Name' = 'note.txt' } -SkipHttpErrorCheck -TimeoutSec 5
            if ($pf.StatusCode -ne 204) { throw "PUT /db/file 应返回 204，实际 $($pf.StatusCode)" }

            $gf = Invoke-WebRequest -Uri 'http://127.0.0.1:8799/db/file/att1' -TimeoutSec 5
            if ($gf.StatusCode -ne 200) { throw "GET /db/file 应返回 200，实际 $($gf.StatusCode)" }
            if ($gf.Content -ne 'hello-attachment') { throw "附件内容不一致: $($gf.Content)" }
            if ($gf.Headers['Content-Type'] -notmatch 'text/plain') { throw "附件 Content-Type 丢失: $($gf.Headers['Content-Type'])" }

            # 内容寻址：media/ 下应出现 sha256 命名的原件
            $ms = [System.IO.MemoryStream]::new($ab)
            $sha = (Get-FileHash -Algorithm SHA256 -InputStream $ms).Hash.ToLower()
            if (-not (Test-Path "data\media\$sha")) { throw "未按 sha256 落盘: media/$sha" }

            # index.json 的 files 结构要与 Python 版兼容
            $idx = Get-Content 'data\meta\index.json' -Raw | ConvertFrom-Json
            if ($null -eq $idx.files.att1) { throw 'index.json 缺少 files.att1' }
            if ($idx.files.att1.sha -ne $sha) { throw "index.json 里 sha 不对: $($idx.files.att1.sha)" }

            $nf = Invoke-WebRequest -Uri 'http://127.0.0.1:8799/db/file/nope' -SkipHttpErrorCheck -TimeoutSec 5
            if ($nf.StatusCode -ne 404) { throw "不存在的附件应 404，实际 $($nf.StatusCode)" }

            # ---------- 导入暂存 ----------
            $sc = Invoke-WebRequest -Uri 'http://127.0.0.1:8799/db/staging/clear' -Method Post -SkipHttpErrorCheck -TimeoutSec 5
            if ($sc.StatusCode -ne 204) { throw "staging/clear 应 204，实际 $($sc.StatusCode)" }

            $stg = '{"id":"imp1","title":"导入的","createdAt":7000,"updatedAt":7000,"messages":[{"id":"m1","role":"user","content":"hi","files":[{"id":"sf1","mimeType":"image/png"}]}]}'
            $sb = [System.Text.Encoding]::UTF8.GetBytes($stg)
            $ss = Invoke-WebRequest -Uri 'http://127.0.0.1:8799/db/staging/session/imp1' -Method Put -Body $sb -ContentType 'application/json' -SkipHttpErrorCheck -TimeoutSec 5
            if ($ss.StatusCode -ne 204) { throw "staging/session 应 204，实际 $($ss.StatusCode)" }

            $sfb = [System.Text.Encoding]::UTF8.GetBytes('staged-file')
            $sf = Invoke-WebRequest -Uri 'http://127.0.0.1:8799/db/staging/file/sf1' -Method Put -Body $sfb -ContentType 'image/png' -SkipHttpErrorCheck -TimeoutSec 5
            if ($sf.StatusCode -ne 204) { throw "staging/file 应 204，实际 $($sf.StatusCode)" }

            $cm = Invoke-WebRequest -Uri 'http://127.0.0.1:8799/db/staging/commit' -Method Post -SkipHttpErrorCheck -TimeoutSec 5
            if ($cm.StatusCode -ne 200) { throw "staging/commit 应 200，实际 $($cm.StatusCode)" }
            $cmList = @($cm.Content | ConvertFrom-Json)
            if ($cmList.Count -ne 1) { throw "commit 应返回 1 条，实际 $($cmList.Count)" }
            if ($cmList[0].id -ne 'imp1') { throw "commit 返回的 id 不对: $($cmList[0].id)" }

            # commit 后：新会话到位、旧会话被替换、暂存被清空
            if (-not (Test-Path 'data\sessions\imp1.json')) { throw '导入的会话未落盘' }
            if (Test-Path 'data\sessions\s1.json') { throw 'commit 应替换旧会话，s1 不该还在' }
            $left = (Get-ChildItem 'data\staged\sessions' -ErrorAction SilentlyContinue).Count
            if ($left -ne 0) { throw "暂存会话未清空，剩 $left" }

            # 附件是 image/png，PowerShell 不会把它解码成文本，
            # $g2.Content 是 byte[]，要先转字符串再比。
            $g2 = Invoke-WebRequest -Uri 'http://127.0.0.1:8799/db/file/sf1' -TimeoutSec 5
            $g2text = if ($g2.Content -is [byte[]]) { [System.Text.Encoding]::UTF8.GetString($g2.Content) } else { [string]$g2.Content }
            if ($g2text -ne 'staged-file') { throw "导入的附件读不回来: $g2text" }
            # 导入时带的 MIME 必须保留（否则“压缩图片”认不出它是图片）
            if ($g2.Headers['Content-Type'] -notmatch 'image/png') { throw "导入附件的 MIME 丢失: $($g2.Headers['Content-Type'])" }

            Write-Host '自检通过'
          } finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }

          # 不传 --www 时应该相对 exe 所在目录向上找，而不能依赖 CWD。
          # 同时放一个诱饵 data 目录在上级：它**不能**被采用。
          # （实测过：exe 在 Downloads\xxx\，往上扫到 Downloads\data，
          #   把数据目录指到了无关文件夹，用户看到空会话列表。）
          $layout = Join-Path $env:RUNNER_TEMP 'layout'
          $bin = Join-Path $layout 'rust\target\release'
          New-Item -ItemType Directory -Force -Path $bin, (Join-Path $layout 'www'), (Join-Path $layout 'data') | Out-Null
          Set-Content -Encoding utf8 (Join-Path $layout 'www\index.html') '<div id=root>x</div>'
          Copy-Item $exe (Join-Path $bin 'dsh-chat.exe')
          Push-Location $env:RUNNER_TEMP
          $p2 = Start-Process -FilePath (Join-Path $bin 'dsh-chat.exe') -ArgumentList '--port','8798','--no-open','--console' -PassThru -NoNewWindow -RedirectStandardOutput 'out2.txt'
          try {
            $st2 = $null
            for ($i = 0; $i -lt 40; $i++) {
              Start-Sleep -Milliseconds 250
              try { $st2 = Invoke-RestMethod 'http://127.0.0.1:8798/local/status' -TimeoutSec 2; break } catch { }
            }
            if ($null -eq $st2) { Get-Content 'out2.txt' -ErrorAction SilentlyContinue; throw '服务未就绪' }
            if ((Invoke-WebRequest 'http://127.0.0.1:8798/' -TimeoutSec 2).StatusCode -ne 200) {
              throw '不传 --www 时未能从 exe 目录向上找到 www'
            }
            Write-Host ("dataDir -> " + $st2.dataDir)
            # 数据目录必须是 exe 同级，不能是上级那个诱饵
            if ($st2.dataDir -notlike '*rust\target\release\data') {
              throw "数据目录不应向上查找（诱饵被采用了）: $($st2.dataDir)"
            }
            Write-Host '默认路径解析 OK（www 向上找，data 只用 exe 同级）'
          } finally {
            Stop-Process -Id $p2.Id -Force -ErrorAction SilentlyContinue
            Pop-Location
          }

      # 产物就是**一个 exe**：前端已由 build.rs 内嵌（见 rust/build.rs）。
      #
      # 不再附带 www/：那份 3.8 MB 的文件已经编进 exe 了，再发一份只是重复。
      # 上面的 `serves_embedded_ui_without_www_dir` 用例保证了“没 www 也能出界面”，
      # 否则这一步会把一个白屏 exe 发出去。
      - name: Package
        run: |
          New-Item -ItemType Directory -Force -Path dist-pkg | Out-Null
          Copy-Item rust/target/release/dsh-chat.exe dist-pkg/
          Compress-Archive -Path dist-pkg/* -DestinationPath dsh-chat-rust-win.zip -Force
          Write-Host ("exe 大小: {0:N2} MB" -f ((Get-Item rust/target/release/dsh-chat.exe).Length / 1MB))
          Write-Host ("zip 大小: {0:N2} MB" -f ((Get-Item dsh-chat-rust-win.zip).Length / 1MB))

      - uses: actions/upload-artifact@v5
        with:
          name: dsh-chat-rust-windows
          path: dsh-chat-rust-win.zip
          if-no-files-found: error

  # ---------------------------------------------------------------- Android
  android:
    needs: [web]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # 同 Windows：前端要先就位，因为 build.rs 会把它内嵌进 .so。
      - name: Replace www with CI build
        run: |
          rm -rf www
          mkdir -p www

      - uses: actions/download-artifact@v5
        with:
          name: www-dist
          path: www

      # ---- Rust 后端：交叉编译出 arm64-v8a 的 libdsh_chat_server.so ----
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      # 安卓启动图标（mipmap-*）由这一步生成；gradle 打包时会用到。
      - name: Generate icons
        # 同 Windows：失败不阻断，仓库里已有生成物兵底。
        continue-on-error: true
        run: python3 tools/make-icons.py

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: android

      - name: Setup Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          add-to-path: true

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      # cargo-ndk 把 CC/AR/linker 指向 NDK 的 clang；
      # aarch64-linux-android 的 std 是预编译的，直接能链。
      # 产物落在 android/app/src/main/jniLibs/arm64-v8a/，AGP 自动打进 APK。
      - name: Build Rust backend (.so)
        working-directory: rust
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          # --lib：只要 cdylib（libdsh_chat_server.so）。不指定的话会连 [[bin]]
          # 一起为 aarch64-linux-android 编一个用不上的可执行文件。
          cargo ndk -t arm64-v8a -o ../android/app/src/main/jniLibs build --release --lib
          ls -lh ../android/app/src/main/jniLibs/arm64-v8a/
          # 符号自检：JNI 函数名必须和 Java 侧的包名/类名/方法名对上，
          # 库名要是 libdsh_chat_server.so（对应 Cargo.toml 的 [lib] name）。
          # 对不上只会在手机上炸 UnsatisfiedLinkError，所以在这里就拦下来。
          SO=../android/app/src/main/jniLibs/arm64-v8a/libdsh_chat_server.so
          test -f "$SO" || { echo "::error::没有生成 libdsh_chat_server.so"; exit 1; }
          NM="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          if [ -x "$NM" ]; then
            "$NM" -D "$SO" | grep -q 'Java_com_dangjiyi_dshchat_MainActivity_nativeStart' \
              || { echo "::error::so 里缺 nativeStart 的 JNI 符号"; exit 1; }
            "$NM" -D "$SO" | grep -q 'Java_com_dangjiyi_dshchat_MainActivity_nativeLastError' \
              || { echo "::error::so 里缺 nativeLastError 的 JNI 符号"; exit 1; }
            echo "JNI 符号检查通过"
          fi
          # 前端是否真的被内嵌进 .so：找一段只在真实前端里出现的字符串。
          # 没有的话说明 build.rs 没找到 www，打出来的 APK 会白屏。
          if strings "$SO" | grep -q 'id="root"'; then
            echo "内嵌前端检查通过"
          else
            echo "::error::so 里没找到前端内容，APK 会白屏"
            exit 1
          fi

      - name: Resolve versionName
        id: v
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            # 推 tag 时以 tag 名为准（发版场景）
            VERSION="${GITHUB_REF_NAME#v}"
          else
            # 从 rust/Cargo.toml 的 [package] version 读——那是唯一真相源。
            #
            # 以前这里写死 0.2.4，并通过 -PversionName 覆盖了 build.gradle 的值，
            # 于是 APK 永远显示 0.2.4-时间戳，而 Rust 早就是 0.2.6。
            # 那个不一致极容易让人误判成“改动没生效”，排查多花了很多时间。
            VERSION=$(grep -m1 '^version' rust/Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
            if [[ -z "$VERSION" ]]; then
              echo "::error::无法从 rust/Cargo.toml 读取 version"
              exit 1
            fi
            # 加时间戳便于区分同一版本的不同构建
            VERSION="${VERSION}-$(date -u +%Y%m%d%H%M)"
          fi
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "APK versionName: $VERSION"

      - name: Build APK
        working-directory: android
        run: gradle assembleDebug -PversionName=${{ steps.v.outputs.name }} --no-daemon

      # 体积构成分析：解包 APK 按大小排序，直接看钱花在哪。
      - name: Analyze APK size
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          echo "=== total ==="
          ls -lh "$APK" | awk '{print $5}'
          echo "=== by top-level dir ==="
          unzip -l "$APK" | awk 'NR>3 && $4!="" {split($4,p,"/"); s[p[1]]+=$1} END {for (k in s) printf "%10.1f KB  %s\n", s[k]/1024, k}' | sort -rn | head -12
          echo "=== 30 largest entries ==="
          unzip -l "$APK" | awk 'NR>3 && $1 ~ /^[0-9]+$/ {printf "%10.1f KB  %s\n", $1/1024, $4}' | sort -rn | head -30
          unzip -l "$APK" > apk-contents.txt
          # .so 必须在 APK 里，否则装上就崩
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libdsh_chat_server.so' \
            || { echo "::error::APK 里没有 libdsh_chat_server.so"; exit 1; }

      - uses: actions/upload-artifact@v5
        with:
          name: apk-contents
          path: apk-contents.txt
          if-no-files-found: warn

      - uses: actions/upload-artifact@v5
        with:
          name: dsh-chat-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
