name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- Windows
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build exe
        working-directory: server
        run: pyinstaller --noconfirm dsh-chat.spec

      - name: Package
        run: Compress-Archive -Path server/dist/dsh-chat -DestinationPath dsh-chat-win.zip

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-chat-windows
          path: dsh-chat-win.zip
          if-no-files-found: error

  # ---------------------------------------------------------------- Android
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Check server.py copies are in sync
        run: diff server/server.py android/app/src/main/python/server.py

      - name: Resolve versionName
        id: v
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=0.2.0-$(date -u +%Y%m%d%H%M)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        working-directory: android
        run: gradle assembleDebug -PversionName=${{ steps.v.outputs.name }} --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-chat-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
