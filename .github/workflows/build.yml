name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- Web
  # 前端由 CI 构建，不再依赖有人在本地跑 rspack。
  # windows / android 两个 job 都会用这份产物覆盖 www/，
  # 所以仓库里的 www/ 只当“参考产物”——即使忘了重建，打出来的包也是对的。
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: '9'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # DSH_LOCAL=1 → apiOrigin 为空，请求走同源，由 server.py 反向代理注入 Key。
      # 漏了这个就变成直连上游 + 哨兵值当 Key，聊天恒 401。
      - name: Build frontend
        run: pnpm build
        env:
          DSH_LOCAL: '1'

      - name: Trim font formats WebView never loads
        run: |
          find dist/static/media -name '*.ttf' -delete
          find dist/static/media -name '*.woff' -delete

      - name: Verify same-origin build
        run: |
          if grep -rq 'https://api.deepseek.com' dist/static/js/; then
            echo "::error::dist 里出现了绝对地址，DSH_LOCAL 没生效"
            exit 1
          fi

      - uses: actions/upload-artifact@v5
        with:
          name: www-dist
          path: dist
          if-no-files-found: error

  # ---------------------------------------------------------------- Windows
  windows:
    needs: [web]
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # 用 CI 构建的前端覆盖仓库里的 www，保证 exe 里的界面与 src 一致
      - name: Replace www with CI build
        shell: bash
        run: |
          rm -rf www
          mkdir -p www

      - uses: actions/download-artifact@v5
        with:
          name: www-dist
          path: www

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build exe
        working-directory: server
        run: pyinstaller --noconfirm dsh-chat.spec

      # 单文件模式：产物是一个 exe，没有 _internal 目录
      - name: Verify output
        run: |
          if (-not (Test-Path server/dist/dsh-chat.exe)) { throw "dsh-chat.exe not found" }
          Get-Item server/dist/dsh-chat.exe | Format-List Name, Length

      - uses: actions/upload-artifact@v5
        with:
          name: dsh-chat-windows
          path: server/dist/dsh-chat.exe
          if-no-files-found: error

  # ---------------------------------------------------------------- Android
  android:
    needs: [web]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # 用 CI 构建出来的前端覆盖仓库里的 www，避免“改了 src 忘了重建”。
      - name: Replace www with CI build
        run: |
          rm -rf www
          mkdir -p www

      - uses: actions/download-artifact@v5
        with:
          name: www-dist
          path: www

      - name: Check server.py copies are in sync
        run: diff server/server.py android/app/src/main/python/server.py

      # ---- Rust 后端：交叉编译出 arm64-v8a 的 libdsh_chat.so ----
      #
      # 注意顺序：必须在“Replace www”之后。`rust/build.rs` 会把 chat/www 内嵌进
      # .so（安卓端不再从 assets 解压前端），所以要先把 CI 构建出来的 www 放好。
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          # 与 windows 侧分开缓存：target 不同（aarch64-linux-android）
          key: android

      - name: Setup Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          add-to-path: true

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      # cargo-ndk 负责把 CC/AR/linker 环境变量指向 NDK 的 clang，
      # aarch64-linux-android 的 std 是预编译的，直接能链。
      # 产物落在 android/app/src/main/jniLibs/arm64-v8a/libdsh_chat.so，
      # AGP 会自动打进 APK。
      - name: Build Rust backend (.so)
        working-directory: rust
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          cargo ndk -t arm64-v8a -o ../android/app/src/main/jniLibs build --release
          ls -lh ../android/app/src/main/jniLibs/arm64-v8a/
          # 符号自检：JNI 函数名必须和 Java 侧的包名/类名/方法名对上，
          # 且库名要是 libdsh_chat_server.so（对应 Cargo.toml 的 [lib] name）。
          # 对不上的话只会在手机上跑起来时炸 UnsatisfiedLinkError。
          SO=../android/app/src/main/jniLibs/arm64-v8a/libdsh_chat_server.so
          test -f "$SO" || { echo "::error::没有生成 libdsh_chat_server.so"; exit 1; }
          NM="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          if [ -x "$NM" ]; then
            "$NM" -D "$SO" | grep -q 'Java_com_dangjiyi_dshchat_MainActivity_nativeStart' \
              || { echo "::error::so 里缺 nativeStart 的 JNI 符号"; exit 1; }
            "$NM" -D "$SO" | grep -q 'Java_com_dangjiyi_dshchat_MainActivity_nativeLastError' \
              || { echo "::error::so 里缺 nativeLastError 的 JNI 符号"; exit 1; }
            echo "JNI 符号检查通过"
          fi

      - name: Resolve versionName
        id: v
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=0.2.0-$(date -u +%Y%m%d%H%M)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        working-directory: android
        run: gradle assembleDebug -PversionName=${{ steps.v.outputs.name }} --no-daemon

      # 体积构成分析：解包 APK 按大小排序，直接看钱花在哪。
      # 结果写在日志里，也存成 artifact，方便对比改动的效果。
      - name: Analyze APK size
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          echo "=== total ==="
          ls -lh "$APK" | awk '{print $5}'
          echo "=== by top-level dir ==="
          unzip -l "$APK" | awk 'NR>3 && $4!="" {split($4,p,"/"); s[p[1]]+=$1} END {for (k in s) printf "%10.1f KB  %s\n", s[k]/1024, k}' | sort -rn | head -12
          echo "=== 30 largest entries ==="
          unzip -l "$APK" | awk 'NR>3 && $1 ~ /^[0-9]+$/ {printf "%10.1f KB  %s\n", $1/1024, $4}' | sort -rn | head -30
          unzip -l "$APK" > apk-contents.txt

      - uses: actions/upload-artifact@v5
        with:
          name: apk-contents
          path: apk-contents.txt
          if-no-files-found: warn

      - uses: actions/upload-artifact@v5
        with:
          name: dsh-chat-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
