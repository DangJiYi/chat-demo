plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

// Python 源码放在 Chaquopy 的默认目录 src/main/python/server.py。
//
// 不在这里做"构建时从 server/ 复制"：syncServerPy 会把 src/main/python 同时作为
// 任务输出和 Chaquopy 的输入，Gradle 判定为隐式依赖并直接拒绝构建。
// 两份副本的一致性由 CI 的 diff 步骤保证（不同步会直接失败）。

android {
    namespace 'com.dangjiyi.dshchat'
    compileSdk 34

    defaultConfig {
        applicationId 'com.dangjiyi.dshchat'
        minSdk 24
        targetSdk 34
        versionCode 19
        // CI 里用 -PversionName=v0.2.0 注入；本地构建用默认值
        versionName (project.findProperty('versionName') ?: '0.2.0')

        // 只出 arm64-v8a：Chaquopy 的 libpython 每个 ABI 各一份，
        // 带上 armeabi-v7a 等于把 native 部分翻倍。
        // 2020 年后的安卓手机基本都是 arm64；要兼容 32 位老机器就改回
        // abiFilters 'arm64-v8a', 'armeabi-v7a'
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    sourceSets {
        main {
            // 前端静态站平铺进 assets 根；MainActivity 启动时复制到私有目录
            // Python 源码在默认位置 src/main/python（见文件顶部说明）
            assets.srcDir '../../www'
        }
    }

    buildTypes {
        debug {
            // 不压缩、带调试符号，体积明显偏大；出包请用 release
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    packagingOptions {
        // extractNativeLibs=false：.so 不再解压到应用目录，直接从 APK 内加载。
        //
        // 代价：APK 里的 .so 必须不压缩（体积约 +4 MB 下载量）。
        // 收益：手机上不再保留一份解压出来的副本（约 -7 MB 占用）。
        // 你关心的是“手机里占多少”，所以选这个。
        jniLibs {
            useLegacyPackaging false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// 不写 python { } 块：server.py 只用标准库，没有 pip 依赖，
// buildPython 用 Chaquopy 的默认值（Linux 上是 python3，runner 自带）。

dependencies {
}
