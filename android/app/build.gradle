plugins {
    id 'com.android.application'
}

// 后端是 Rust，不再是 Python：
//   rust/ 交叉编译成 arm64-v8a 的 libdsh_chat.so，放进 src/main/jniLibs/
//   MainActivity 用 System.loadLibrary("dsh_chat") 加载，再通过 JNI 起服务。
//
// .so 不由 Gradle 编译（没有 CMake/ndk-build 配置），而是 CI 里用 cargo-ndk 产出后
// 拷进 src/main/jniLibs/arm64-v8a/。本地出包时同理，见 chat/BUILD.md。

android {
    namespace 'com.dangjiyi.dshchat'
    compileSdk 34

    defaultConfig {
        applicationId 'com.dangjiyi.dshchat'
        minSdk 24
        targetSdk 34
        versionCode 27
        // CI 里用 -PversionName=v0.2.x 注入；本地构建用默认值
        versionName (project.findProperty('versionName') ?: '0.2.7')

        // 只出 arm64-v8a。
        // 2020 年后的安卓手机基本都是 arm64；要兼容 32 位老机器就加 'armeabi-v7a'
        // ——代价是 .so 再来一份。
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    // 不再需要 sourceSets.assets：前端已经由 rust/build.rs 编进 .so，
    // APK 里不放 www/，也就不需要在启动时解压 3.4 MB 到私有目录。

    buildTypes {
        debug {
            // 不压缩、带调试符号，体积明显偏大；出包请用 release
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    packagingOptions {
        // extractNativeLibs=false：.so 不再解压到应用目录，直接从 APK 内加载。
        //
        // 代价：APK 里的 .so 必须不压缩（下载量略大）。
        // 收益：手机上不再保留一份解压出来的副本。
        // 你关心的是“手机里占多少”，所以选这个。
        jniLibs {
            useLegacyPackaging false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
