plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

// server.py 只有一份源（仓库根的 server/server.py）。
// Chaquopy 只认 app/src/main/python/，所以构建前自动复制过去，
// 本地和 CI 走同一条路，不会出现两份漂移。
// tray.py 是 Windows 专用（Android 上 start_tray 直接返回 None，不会 import），所以不复制。
tasks.register('syncServerPy', Copy) {
    from '../../server/server.py'
    into 'src/main/python'
}
preBuild.dependsOn syncServerPy

android {
    namespace 'com.dangjiyi.dshchat'
    compileSdk 34

    defaultConfig {
        applicationId 'com.dangjiyi.dshchat'
        minSdk 24
        targetSdk 34
        versionCode 2
        // CI 里用 -PversionName=v0.2.0 注入；本地构建用默认值
        versionName (project.findProperty('versionName') ?: '0.2.0')

        // 只出手机常见的两种 ABI，APK 能小一半
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    sourceSets {
        main {
            // 前端静态站平铺进 assets 根；MainActivity 启动时复制到私有目录
            // Python 源码用 Chaquopy 的默认位置 src/main/python（由 syncServerPy 生成）
            assets.srcDir '../../www'
        }
    }

    buildTypes {
        debug {
            // 个人自用，debug 签名足够
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// 不写 python { } 块：server.py 只用标准库，没有 pip 依赖，
// buildPython 用 Chaquopy 的默认值（Linux 上是 python3，runner 自带）。

dependencies {
}
