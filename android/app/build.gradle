plugins {
    id 'com.android.application'
    id 'com.chaquopy.python'
}

android {
    namespace 'com.dangjiyi.dshchat'
    compileSdk 34

    defaultConfig {
        applicationId 'com.dangjiyi.dshchat'
        minSdk 24
        targetSdk 34
        versionCode 2
        // CI 里用 -PversionName=v0.2.0 注入；本地构建用默认值
        versionName (project.findProperty('versionName') ?: '0.2.0')

        // 只出手机常见的两种 ABI，APK 能小一半
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    sourceSets {
        main {
            // Python 源码：仓库根的 server/（server.py）
            python.srcDir '../../server'
            // 前端静态站：仓库根的 www/，打包进 assets，首次启动解压到私有目录
            assets.srcDirs += ['../../www']
        }
    }

    buildTypes {
        debug {
            // 个人自用，debug 签名足够；产物不过期，可直接安装
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging false
        }
    }
}

python {
    // server.py 只用标准库，没有任何 pip 依赖
}

dependencies {
}
