apply plugin: 'com.android.application'
apply plugin: 'com.chaquo.python'

android {
    namespace 'com.dangjiyi.dshchat'
    compileSdk 34

    defaultConfig {
        applicationId 'com.dangjiyi.dshchat'
        minSdk 24
        targetSdk 34
        versionCode 2
        // CI 里用 -PversionName=v0.2.0 注入；本地构建用默认值
        versionName (project.findProperty('versionName') ?: '0.2.0')

        // 只出手机常见的两种 ABI，APK 能小一半
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    sourceSets {
        main {
            // Python 源码：仓库根的 server/（server.py）
            python.srcDir '../../server'
            // 前端静态站：内容平铺进 assets 根，运行时由 MainActivity 复制到私有目录
            assets.srcDir '../../www'
        }
    }

    buildTypes {
        debug {
            // 个人自用，debug 签名足够
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// server.py 只用标准库，没有 pip 依赖，所以不需要 buildPython 去编译 wheel。
// 但 Chaquopy 在配置阶段仍会检查这个字段，这里按平台挑一个存在的解释器。
def buildPy = System.getenv('CHAQUOPY_BUILD_PYTHON')
if (!buildPy) {
    def candidates = ['/usr/bin/python3', '/usr/local/bin/python3']
    def found = candidates.find { new File(it).exists() }
    buildPy = found ?: 'python'
}
python {
    buildPython buildPy
}

dependencies {
}
